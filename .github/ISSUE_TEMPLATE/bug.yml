name: Bug report
description: Jeeves did something wrong or stopped unexpectedly
labels: [bug]
body:
  - type: textarea
    id: diagnose
    attributes:
      label: Output of /jeeves status --diagnose
      description: Type `/jeeves status --diagnose` in the affected session and paste the result. It shows your home folder as ~ and redacts known secret formats; read it before posting.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: history
    attributes:
      label: Output of /jeeves history (optional)
      render: text
  - type: input
    id: terminal
    attributes:
      label: Terminal (Terminal, iTerm, Cursor, VS Code, ...)
