name: Feature request
description: Suggest a change in behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem it solves
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: How we would know it works (acceptance criteria)
      description: One line per observable result, as in the backlog stories.
