name: ci
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same jobs before it builds anything.
  workflow_call:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jeeves
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # No lockfile in the plugin folder: with one, Claude Code runs npm ci on install. TypeScript is pinned exactly in package.json.
      - run: npm install --no-package-lock
      # lint type-checks src/core; engine types are not redistributable, so the full typecheck runs locally.
      - run: npm run lint
      - run: npm test
  mod:
    # claude plugin validate/test need no model calls and no login (checked logged out, ST-8.3).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jeeves
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.319
      - run: claude --version
      - run: claude plugin validate . --strict
      # tests/perf holds timing checks (AC-32 P); shared runners make their times noise, so they run locally only.
      - run: rm -r tests/perf && claude plugin test .
      # Spec §9: the suite again with the /config row autoStart on (tests/mod/mode.ts holds off).
      - run: sh scripts/test-mod-on.sh
      # ST-16.7: the suite again as on a Team account (turn mode; tests/mod/mode.ts holds BOUNDARY 'stop'). Turn x on adds no path.
      - run: sh scripts/test-mod-turn.sh
