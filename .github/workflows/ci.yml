name: ci
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same jobs before it builds anything.
  workflow_call:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jeeves
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jeeves/package-lock.json
      - run: npm ci
      # lint type-checks src/core; engine types are not redistributable, so the full typecheck runs locally.
      - run: npm run lint
      - run: npm test
  mod:
    # claude plugin validate/test need no model calls and no login (checked logged out, ST-8.3).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jeeves
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.319
      - run: claude --version
      - run: claude plugin validate . --strict
      - run: claude plugin test .
