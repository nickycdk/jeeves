name: release
# ST-9.3 (08 §6): a tag vX.Y.Z runs CI, builds the zip and its SHA-256 from the tagged commit, attests its provenance and
# opens a DRAFT GitHub release. The maintainer reads it and publishes it by hand.
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft release
      id-token: write # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: The tag matches every version field
        run: |
          for f in jeeves/.claude-plugin/plugin.json jeeves/package.json jeeves/package-lock.json; do
            v=$(node -p "require('./$f').version")
            test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, but $f says $v"; exit 1; }
          done
          test -f "jeeves/docs/release-notes/$GITHUB_REF_NAME.md" || { echo "::error::jeeves/docs/release-notes/$GITHUB_REF_NAME.md is missing"; exit 1; }
      - run: jeeves/scripts/release-zip.sh HEAD dist
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.zip
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "Jeeves $GITHUB_REF_NAME" --notes-file "jeeves/docs/release-notes/$GITHUB_REF_NAME.md"
