name: compat
# AC-22: the plugin against each listed Claude Code version (validate + the engine test kit; no login, no model calls).
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tibbs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm run compat -- "$RUNNER_TEMP/compat" 2.1.303 2.1.310 2.1.316 2.1.319
      - run: git diff --exit-code docs/compatibility.md || echo "::warning::docs/compatibility.md changed; commit the new matrix"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility
          path: tibbs/docs/compatibility.md
